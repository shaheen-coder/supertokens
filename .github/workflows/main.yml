# .github/workflows/build_wheels.yml
#
# Builds CPython 3.13 wheels for:
#   - Linux   x86_64  (manylinux_2_28)
#   - macOS   x86_64  (10.15+)
#   - macOS   arm64   (Apple Silicon)
#   - Windows x86_64
#
# Pushes to PyPI via Trusted Publishing (OIDC – no token secret needed).
# One-time setup: https://pypi.org/manage/account/publishing/

name: Build & Publish Wheels

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ===========================================================================
  # BUILD WHEELS
  # ===========================================================================
  build_wheels:
    name: ${{ matrix.os }} – ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ────────────────────────────────────────────────────
          - os: Linux
            arch: x86_64
            runner: ubuntu-22.04
            cibw_archs: x86_64

          # ── macOS x86_64 (Intel) ────────────────────────────────────────────
          - os: macOS
            arch: x86_64
            runner: macos-13
            cibw_archs: x86_64
            macos_target: "10.15"

          # ── macOS arm64 (Apple Silicon) ──────────────────────────────────────
          - os: macOS
            arch: arm64
            runner: macos-14
            cibw_archs: arm64
            macos_target: "11.0"

          # ── Windows x86_64 ──────────────────────────────────────────────────
          - os: Windows
            arch: x86_64
            runner: windows-2022
            cibw_archs: AMD64

    steps:
      # ── 1. Checkout (with submodules: nanobind, robin-map) ──────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Host Python (cibuildwheel itself runs on the host) ───────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 3. Build wheels ─────────────────────────────────────────────────────
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0    # v2.22+ bundles cp313 in all images
        env:
          # ── Target: CPython 3.13 only, glibc Linux only ──────────────────────
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP:  "*-musllinux_*"

          CIBW_ARCHS: ${{ matrix.cibw_archs }}

          # ── Linux: manylinux_2_28 ships cp313 starting with 2024.09+ tags ────
          # Use the :latest pinned sha tag so cp313 is guaranteed present.
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64:latest"

          # ── Linux: bootstrap build tools inside the container ────────────────
          # /opt/python/cp313-cp313/bin/pip is the right pip inside manylinux.
          CIBW_BEFORE_ALL_LINUX: |
            /opt/python/cp313-cp313/bin/pip install meson ninja
            echo "--- subprojects/ ---"
            ls subprojects/

          # ── macOS: install meson+ninja; strip -march=native (unsafe cross) ───
          CIBW_BEFORE_ALL_MACOS: |
            pip install meson ninja

          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '' }}

          # On macOS drop -march=native (set via meson native-file override)
          CIBW_ENVIRONMENT_MACOS: >-
            CFLAGS="-O3 -DNDEBUG"
            CXXFLAGS="-O3 -DNDEBUG"

          # ── Windows: install meson+ninja; MSVC already on the runner ─────────
          CIBW_BEFORE_ALL_WINDOWS: |
            pip install meson ninja

          # On Windows use MSVC flags, not GCC flags
          CIBW_ENVIRONMENT_WINDOWS: >-
            CL="/O2 /DNDEBUG"

          # ── Repair: bundle shared libs into the wheel ─────────────────────────
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
          # Windows: no repair needed (static nanobind, MSVC runtime is static)

          # ── Smoke test ────────────────────────────────────────────────────────
          CIBW_TEST_COMMAND: >-
            python -c "import supertokens; print('supertokens OK')"

          CIBW_BUILD_VERBOSITY: 2

        with:
          output-dir: dist/

      # ── 4. Upload wheel artifacts ────────────────────────────────────────────
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # ===========================================================================
  # BUILD SDIST
  # ===========================================================================
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build frontend
        run: pip install build meson ninja

      - name: Build sdist
        run: python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ===========================================================================
  # PUBLISH TO PyPI
  # ===========================================================================
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/supertokens

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Show dist contents
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Test first: uncomment below, verify on test.pypi.org, then re-comment
          # repository-url: https://test.pypi.org/legacy/

